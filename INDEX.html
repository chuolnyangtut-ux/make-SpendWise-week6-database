<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Interactive Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SpendWise Tracker</h1>

        <!-- Form Section for User Inputs -->
        <div class="card">
            <h2>Set Budget & Add Expenses</h2>
            <form id="budget-form">
                <div class="form-group">
                    <label for="total-budget">Monthly Budget ($):</label>
                    <input type="number" id="total-budget" placeholder="Enter total budget" required>
                </div>

                <div class="form-group">
                    <label for="expense-title">Expense Description:</label>
                    <input type="text" id="expense-title" placeholder="e.g., Groceries, Rent">
                </div>

                <div class="form-group">
                    <label for="expense-amount">Expense Amount ($):</label>
                    <input type="number" id="expense-amount" placeholder="Enter expense amount">
                </div>

                <button type="submit" id="add-btn">Update & Add Expense</button>
            </form>
        </div>

        <!-- Dashboard Summary Section -->
        <div class="card">
            <h2>Financial Summary</h2>
            <p><strong>Total Budget:</strong> $<span id="display-budget">0</span></p>
            <p><strong>Total Expenses:</strong> $<span id="display-expenses">0</span></p>
            <p><strong>Remaining Balance:</strong> $<span id="display-balance">0</span></p>
            <div id="status-feedback" class="feedback">Status: Please set your budget.</div>
        </div>

        <!-- Expense List Section -->
        <div class="card">
            <h2>Expense History</h2>
            <ul id="expense-list">
                <!-- Dynamically populated via JavaScript -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
